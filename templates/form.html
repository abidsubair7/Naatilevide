{% extends "base.html" %}
{% block title %}{{ title }} — Naatilevide{% endblock %}
{% block content %}<section class="form-wrap"><div class="form-card wide"><p class="eyebrow">NAATILEVIDE</p><h1>{{ title }}</h1><p class="muted">{{ subtitle }}</p><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label>{{ field.label }}{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{% for error in field.errors %}<span class="error">{{ error }}</span>{% endfor %}</label>{% endfor %}<button class="button" type="submit">Submit →</button></form></div></section>{% endblock %}
